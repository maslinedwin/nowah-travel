<svg width="680" height="640" viewBox="0 0 680 640" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Cascadia Mono',ui-monospace,monospace">
  <defs>
    <clipPath id="card"><rect x="40" y="40" width="600" height="560" rx="18"/></clipPath>
  </defs>

  <rect width="680" height="640" fill="#0b0c0f"/>

  <!-- panel card -->
  <rect x="40" y="40" width="600" height="560" rx="18" fill="#12141a" stroke="#23262f" stroke-width="1.5"/>

  <g clip-path="url(#card)">
    <!-- brand row -->
    <path d="M86 78 l16 -7 -6 7 6 7 -16 -7 z" fill="#00A86B"/>
    <text x="112" y="83" fill="#6b7280" font-size="12" letter-spacing="3">NOWAH</text>

    <!-- hero -->
    <text x="84" y="128" fill="#e7e9ee" font-size="30" font-weight="700">Where to?</text>

    <!-- search input -->
    <rect x="84" y="152" width="512" height="52" rx="14" fill="#171b22" stroke="#00A86B" stroke-width="1.5"/>
    <circle cx="112" cy="178" r="7" fill="none" stroke="#00A86B" stroke-width="2"/>
    <line x1="117" y1="183" x2="123" y2="189" stroke="#00A86B" stroke-width="2" stroke-linecap="round"/>
    <text x="136" y="183" fill="#5c6370" font-size="14">Flights to Tokyo in March</text>
    <rect x="492" y="164" width="90" height="28" rx="14" fill="#00A86B" fill-opacity="0.16"/>
    <text x="507" y="183" fill="#1FD08A" font-size="12" font-weight="700">Search ↵</text>

    <!-- upcoming trips header + unread pill -->
    <text x="84" y="248" fill="#6b7280" font-size="11" letter-spacing="2.5">UPCOMING TRIPS</text>
    <rect x="546" y="230" width="50" height="24" rx="12" fill="#00A86B" fill-opacity="0.14"/>
    <circle cx="562" cy="242" r="4" fill="#1FD08A"/>
    <text x="572" y="246" fill="#1FD08A" font-size="12" font-weight="700">3</text>

    <!-- hero trip card -->
    <rect x="84" y="264" width="512" height="118" rx="14" fill="#161920" stroke="#242833" stroke-width="1.5"/>
    <rect x="94" y="278" width="3" height="90" rx="1.5" fill="#00A86B"/>
    <text x="112" y="306" fill="#e7e9ee" font-size="24" font-weight="700">Tokyo</text>
    <circle cx="544" cy="298" r="6" fill="none" stroke="#8b91a0" stroke-width="2"/>
    <text x="558" y="303" fill="#8b91a0" font-size="13">18°</text>
    <text x="112" y="328" fill="#8b91a0" font-size="13">Japan</text>
    <text x="112" y="362" fill="#8b91a0" font-size="13">Mar 12 – 24</text>
    <rect x="212" y="345" width="62" height="24" rx="12" fill="#00A86B" fill-opacity="0.16"/>
    <text x="226" y="362" fill="#1FD08A" font-size="12" font-weight="700">in 12d</text>

    <!-- compact trip row -->
    <text x="96" y="418" fill="#8b91a0" font-size="13">Lisbon&#160;&#160;·&#160;&#160;May 3 – 9</text>
    <text x="584" y="418" fill="#1FD08A" font-size="12" text-anchor="end">in 62d</text>

    <!-- all trips link -->
    <text x="84" y="452" fill="#6b7280" font-size="12">All trips →</text>

    <!-- quick-link tiles row (hint) -->
    <g stroke-width="1.5">
      <rect x="84" y="472" width="162" height="64" rx="14" fill="#00A86B" fill-opacity="0.10" stroke="#00A86B"/>
      <path d="M157 494 l20 -9 -8 9 8 9 -20 -9 z" fill="#00A86B"/>
      <text x="165" y="526" fill="#e7e9ee" font-size="12" text-anchor="middle">Flights</text>

      <rect x="259" y="472" width="162" height="64" rx="14" fill="#161920" stroke="#242833"/>
      <path d="M328 500 h24 v-8 a4 4 0 0 0 -4 -4 h-10 v8 h-10 z m0 0 v-14" fill="none" stroke="#cfd3db" stroke-width="2" stroke-linecap="round"/>
      <text x="340" y="526" fill="#8b91a0" font-size="12" text-anchor="middle">Hotels</text>

      <rect x="434" y="472" width="162" height="64" rx="14" fill="#161920" stroke="#242833"/>
      <path d="M515 482 a9 9 0 0 1 9 9 c0 7 -9 15 -9 15 s-9 -8 -9 -15 a9 9 0 0 1 9 -9 z" fill="none" stroke="#cfd3db" stroke-width="2"/>
      <text x="515" y="526" fill="#8b91a0" font-size="12" text-anchor="middle">Trips</text>
    </g>

    <!-- footer -->
    <text x="84" y="574" fill="#5c6370" font-size="11">Connected as you@nowah.xyz&#160;&#160;·&#160;&#160;disconnect</text>
  </g>
</svg>
